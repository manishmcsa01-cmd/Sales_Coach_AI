<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Sales Coach AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-600 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-900">Sales Coach AI</h1>
            <p class="text-gray-500 mt-1">GCash Field Sales Platform</p>
        </div>

        <div id="error" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2 font-medium">Email</label>
                <input type="email" id="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="dsp@test.com" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2 font-medium">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="password" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-xs text-gray-400 text-center">
            <p class="font-medium mb-1">Test Credentials:</p>
            <p>DSP: dsp@test.com / password</p>
            <p>Manager: manager@test.com / password</p>
            <p>Admin: admin@test.com / password</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            const btn = document.getElementById('loginBtn');
            errorDiv.classList.add('hidden');
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || 'Login failed');
                }

                const data = await res.json();
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('user_name', data.user_name);
                window.location.href = '/dashboard';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
