{% extends "base.html" %}
{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">System Health</h2>
    <p class="text-gray-500 mt-1">Data freshness and model diagnostics.</p>
</div>

<div id="health-content">
    <p class="text-gray-500">Loading...</p>
</div>

<script>
async function loadHealth() {
    const token = localStorage.getItem('access_token');
    const headers = token ? {'Authorization': `Bearer ${token}`} : {};
    
    try {
        const res = await fetch('/api/admin/health', {headers});
        const data = await res.json();
        
        let tablesHtml = data.tables.map(t => `
            <div class="flex justify-between p-2 border-b">
                <span class="font-medium">${t.name}</span>
                <span class="text-gray-600">${t.count} records</span>
            </div>
        `).join('');

        document.getElementById('health-content').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-lg shadow p-4">
                    <h3 class="font-bold text-gray-700 mb-4">Database Stats</h3>
                    ${tablesHtml}
                    <div class="mt-4 text-sm text-gray-500 text-right">
                        Est. Size: ${data.db_size_mb} MB
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-4">
                    <h3 class="font-bold text-gray-700 mb-4">AI Model Status</h3>
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-gray-500">Scoring Model Version</p>
                            <p class="text-lg font-medium">${data.scoring_model_version}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">Last Score Update</p>
                            <p class="text-lg font-medium">${data.last_score_date}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
    } catch (err) {
        document.getElementById('health-content').innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
    }
}
loadHealth();
</script>
{% endblock %}
