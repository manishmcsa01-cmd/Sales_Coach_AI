{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold text-gray-800 mb-6">Area Summary</h2>

<div id="summary-container">
    <div class="animate-pulse bg-white rounded-lg shadow p-6">
        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
    </div>
</div>

<script>
async function loadSummary() {
    const token = localStorage.getItem('access_token');
    const headers = token ? {'Authorization': `Bearer ${token}`} : {};

    try {
        const res = await fetch('/api/briefs/summary/area', {headers});
        const data = await res.json();

        document.getElementById('summary-container').innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <p class="text-sm text-gray-500 mb-1">Total Outlets</p>
                    <p class="text-3xl font-bold text-blue-700">${data.total_outlets}</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <p class="text-sm text-gray-500 mb-1">Active</p>
                    <p class="text-3xl font-bold text-green-600">${data.active_count}</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <p class="text-sm text-gray-500 mb-1">At Risk</p>
                    <p class="text-3xl font-bold text-red-600">${data.at_risk_count}</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center">
                    <p class="text-sm text-gray-500 mb-1">Avg Score</p>
                    <p class="text-3xl font-bold text-orange-600">${data.avg_score}</p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-bold mb-4">Key Issues</h3>
                <ul class="space-y-2">
                    ${data.top_issues.map(issue => `
                        <li class="flex items-center text-gray-700">
                            <span class="w-2 h-2 bg-red-500 rounded-full mr-3"></span>
                            ${issue}
                        </li>
                    `).join('')}
                </ul>
            </div>
        `;
    } catch (err) {
        document.getElementById('summary-container').innerHTML =
            '<p class="text-red-500">Error loading summary: ' + err.message + '</p>';
    }
}

loadSummary();
</script>
{% endblock %}
