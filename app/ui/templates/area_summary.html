{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold text-gray-800 mb-6">Area Summary</h2>

<div id="summary-container">
    <div class="animate-pulse bg-white rounded-lg shadow p-6">
        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
    </div>
</div>

<script>
async function loadSummary() {
    const token = localStorage.getItem('access_token');
    const headers = token ? {'Authorization': `Bearer ${token}`} : {};

    try {
        const res = await fetch('/api/briefs/summary/area', {headers});
        if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `Server returned status ${res.status}`);
        }
        const data = await res.json();
        const topIssues = Array.isArray(data.top_issues) ? data.top_issues : [];

        document.getElementById('summary-container').innerHTML = `
            <div class="mb-4">
                <span class="text-sm font-semibold uppercase tracking-wider text-blue-700 bg-blue-100 px-3 py-1 rounded-full">
                    📍 ${data.area_name || 'All Areas'}
                </span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-6 text-center border-t-4 border-blue-500">
                    <p class="text-sm text-gray-500 mb-1">Total Outlets</p>
                    <p class="text-3xl font-bold text-blue-700">${data.total_outlets ?? 0}</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center border-t-4 border-green-500">
                    <p class="text-sm text-gray-500 mb-1">Active</p>
                    <p class="text-3xl font-bold text-green-600">${data.active_count ?? 0}</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center border-t-4 border-red-500">
                    <p class="text-sm text-gray-500 mb-1">At Risk</p>
                    <p class="text-3xl font-bold text-red-600">${data.at_risk_count ?? 0}</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 text-center border-t-4 border-orange-500">
                    <p class="text-sm text-gray-500 mb-1">Avg Score</p>
                    <p class="text-3xl font-bold text-orange-600">${data.avg_score ?? 0}</p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-bold mb-4 text-gray-800">Key Territory Issues & Priorities</h3>
                <ul class="space-y-3">
                    ${topIssues.map(issue => `
                        <li class="flex items-center text-gray-700">
                            <span class="w-2.5 h-2.5 bg-blue-500 rounded-full mr-3 flex-shrink-0"></span>
                            <span>${issue}</span>
                        </li>
                    `).join('')}
                </ul>
            </div>
        `;
    } catch (err) {
        document.getElementById('summary-container').innerHTML =
            '<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">' +
            '<strong>Error loading summary:</strong> ' + err.message +
            '</div>';
    }
}

loadSummary();
</script>
{% endblock %}
