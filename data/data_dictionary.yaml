# ==============================================================================
# Sales Coach AI - Enterprise Data Dictionary (GCash Field Sales & Merchant Acquisition)
# 35 Domain Tables | 8 Functional Domains | Philippine Retail & Mobile Financial Services
# ==============================================================================

# ------------------------------------------------------------------------------
# DOMAIN 1: GEOGRAPHIC & TERRITORY HIERARCHY (4 TABLES)
# ------------------------------------------------------------------------------
regions:
  domain: "Territory Hierarchy"
  description: "Top-level administrative regions in the Philippines (NCR, Region VII Visayas, Region IV-A)"
  rows: 4
  columns:
    id: { type: UUID, pk: true, description: "Unique region identifier" }
    region_code: { type: String, unique: true, description: "Standard ISO/PSGC code (e.g. NCR, REG-VII, REG-IVA)" }
    region_name: { type: String, description: "Full formal name (e.g. National Capital Region, Central Visayas)" }
    island_group: { type: String, values: [Luzon, Visayas, Mindanao], description: "Island grouping" }
    created_at: { type: DateTime, description: "Creation timestamp" }

provinces:
  domain: "Territory Hierarchy"
  description: "Provinces or sub-regions within major geographic regions"
  rows: 8
  columns:
    id: { type: UUID, pk: true, description: "Unique province identifier" }
    region_id: { type: UUID, fk: regions.id, description: "Parent region reference" }
    province_name: { type: String, description: "Province name (e.g. Metro Manila, Cebu, Cavite, Rizal)" }
    province_code: { type: String, unique: true, description: "Short alphanumeric code" }
    created_at: { type: DateTime, description: "Creation timestamp" }

cities_municipalities:
  domain: "Territory Hierarchy"
  description: "Cities and municipalities where merchant retail outlets are situated"
  rows: 25
  columns:
    id: { type: UUID, pk: true, description: "Unique city identifier" }
    province_id: { type: UUID, fk: provinces.id, description: "Parent province reference" }
    city_name: { type: String, description: "City name (e.g. Makati, Quezon City, Taguig, Cebu City, Pasig)" }
    postal_code: { type: String, description: "Philippine postal zip code" }
    urban_tier: { type: String, values: [Metro_Tier1, Urban_Tier2, Suburban_Tier3], description: "Commercial density tier" }
    created_at: { type: DateTime, description: "Creation timestamp" }

areas:
  domain: "Territory Hierarchy"
  description: "Sales management distribution clusters supervised by Sales Area Managers"
  rows: 5
  columns:
    id: { type: UUID, pk: true, description: "Unique sales area identifier" }
    area_name: { type: String, description: "Area cluster name (e.g. Metro Manila North, Metro Manila South, Cebu Central)" }
    region: { type: String, description: "Primary region label for legacy backwards compatibility" }
    city_id: { type: UUID, fk: cities_municipalities.id, nullable: true, description: "Primary hub city" }
    target_monthly_gmv: { type: Float, description: "Monthly GMV quota in PHP for the sales area" }
    created_at: { type: DateTime, description: "Creation timestamp" }

# ------------------------------------------------------------------------------
# DOMAIN 2: PERSONNEL, ORGANIZATIONS & GOVERNANCE (5 TABLES)
# ------------------------------------------------------------------------------
distributors:
  domain: "Personnel & Governance"
  description: "Third-party distribution companies contracted by GCash for field agent management"
  rows: 5
  columns:
    id: { type: UUID, pk: true, description: "Unique distributor partner identifier" }
    company_name: { type: String, description: "Registered entity name (e.g. Fast Logistics Sales Corp, Megawide Distribution)" }
    tax_id: { type: String, description: "BIR TIN number" }
    contact_person: { type: String, description: "Head of Operations name" }
    contact_email: { type: String, description: "Primary corporate email" }
    contact_phone: { type: String, description: "Hotline / mobile phone" }
    status: { type: String, values: [active, suspended, terminated], description: "Contract status" }
    created_at: { type: DateTime, description: "Onboarding timestamp" }

managers:
  domain: "Personnel & Governance"
  description: "Area Sales Managers overseeing DSP field teams, quota fulfillment, and store coverage"
  rows: 5
  columns:
    id: { type: UUID, pk: true, description: "Unique manager identifier" }
    full_name: { type: String, description: "Manager full legal name" }
    email: { type: String, unique: true, description: "Corporate login email" }
    phone: { type: String, description: "Official contact phone" }
    area_id: { type: UUID, fk: areas.id, description: "Supervised sales area cluster" }
    distributor_id: { type: UUID, fk: distributors.id, nullable: true, description: "Employer distributor" }
    status: { type: String, values: [active, on_leave, resigned], description: "Employment status" }
    hire_date: { type: Date, description: "Date hired" }

dsps:
  domain: "Personnel & Governance"
  description: "Distributor Sales Personnel - frontline field representatives visiting retail merchants"
  rows: 40
  columns:
    id: { type: UUID, pk: true, description: "Unique DSP representative identifier" }
    full_name: { type: String, description: "Field rep full name" }
    email: { type: String, unique: true, description: "Login credentials email" }
    phone: { type: String, description: "Assigned mobile phone number" }
    area_id: { type: UUID, fk: areas.id, description: "Assigned sales area" }
    manager_id: { type: UUID, fk: managers.id, nullable: true, description: "Direct reporting line manager" }
    distributor_id: { type: UUID, fk: distributors.id, nullable: true, description: "Distributor employer" }
    status: { type: String, values: [active, inactive], description: "Field active status" }
    hire_date: { type: Date, description: "Onboarding date" }
    daily_target_visits: { type: Integer, range: "8-15", description: "Daily mandatory store visit target" }

user_accounts:
  domain: "Personnel & Governance"
  description: "Authentication and RBAC identity table supporting DSP, Manager, and Admin roles"
  rows: 46
  columns:
    id: { type: UUID, pk: true, description: "User account identifier" }
    email: { type: String, unique: true, description: "Login username" }
    password_hash: { type: String, description: "SHA-256 password hash / Cognito sub" }
    role: { type: String, values: [dsp, manager, admin], description: "Access tier" }
    dsp_id: { type: UUID, fk: dsps.id, nullable: true, description: "Associated DSP profile for reps" }
    is_active: { type: Boolean, default: true, description: "Account enabled flag" }
    last_login: { type: DateTime, nullable: true, description: "Last authentication timestamp" }
    created_at: { type: DateTime, description: "Account creation date" }

audit_logs:
  domain: "Personnel & Governance"
  description: "Security and data-access audit trail (export logs, persona view changes, API access)"
  rows: 1500
  columns:
    id: { type: UUID, pk: true, description: "Unique audit record identifier" }
    user_id: { type: UUID, fk: user_accounts.id, nullable: true, description: "Acting user" }
    action: { type: String, description: "Operation name (e.g. LOGIN, EXPORT_REPORT, VIEW_PROFILE, UPDATE_TARGET)" }
    resource_type: { type: String, description: "Target resource (outlets, dsps, scores, recommendations)" }
    resource_id: { type: String, nullable: true, description: "Identifier of modified/viewed record" }
    ip_address: { type: String, description: "Client IPv4 / IPv6" }
    user_agent: { type: String, description: "Client device / browser user-agent" }
    created_at: { type: DateTime, description: "Execution timestamp" }

# ------------------------------------------------------------------------------
# DOMAIN 3: MERCHANT & BUSINESS ENTITIES (5 TABLES)
# ------------------------------------------------------------------------------
merchants:
  domain: "Merchants"
  description: "Master merchant business entities owning one or multiple retail outlet locations"
  rows: 200
  columns:
    id: { type: UUID, pk: true, description: "Unique merchant corporate identifier" }
    business_name: { type: String, description: "Registered trade name" }
    owner_name: { type: String, description: "Business proprietor or principal officer" }
    contact_number: { type: String, description: "Principal phone number" }
    business_type: { type: String, values: [Supermarket, Convenience, Retail, Pharmacy, Pawnshop, Restaurant, Food_Stall] }
    kyc_status: { type: String, values: [verified, pending, rejected], description: "Bangko Sentral ng Pilipinas KYC compliance" }
    risk_tier: { type: String, values: [low, medium, high], description: "AML / credit risk assessment" }
    registration_date: { type: Date, description: "Merchant registration date" }
    status: { type: String, values: [active, suspended, inactive], description: "Account state" }

merchant_categories:
  domain: "Merchants"
  description: "Granular MCC (Merchant Category Codes) and GCash retail segment definitions"
  rows: 12
  columns:
    id: { type: UUID, pk: true, description: "Unique category identifier" }
    category_code: { type: String, unique: true, description: "Standard code (e.g. RET-SARI, FMCG-SUPER, PHARM-DRUG, F&B-DINE)" }
    category_name: { type: String, description: "Category display name" }
    description: { type: String, description: "Business model definition and baseline requirements" }
    benchmark_monthly_txns: { type: Integer, description: "Expected monthly transaction volume benchmark" }
    default_cash_in_fee_rate: { type: Float, description: "Standard cash-in merchant commission rate" }

merchant_kyc_documents:
  domain: "Merchants"
  description: "Compliance document uploads verifying legitimate business operations"
  rows: 450
  columns:
    id: { type: UUID, pk: true, description: "Unique document record identifier" }
    merchant_id: { type: UUID, fk: merchants.id, description: "Parent merchant" }
    document_type: { type: String, values: [DTI_Certificate, SEC_Registration, Mayors_Permit, BIR_Form_2303, Valid_Govt_ID, Barangay_Clearance] }
    document_number: { type: String, description: "Official reference or permit number" }
    verification_status: { type: String, values: [approved, pending, expired, rejected] }
    verified_at: { type: DateTime, nullable: true, description: "Compliance sign-off timestamp" }
    expires_at: { type: Date, nullable: true, description: "Permit expiration date" }

merchant_bank_accounts:
  domain: "Merchants"
  description: "Merchant settlement bank accounts and linked GCash Merchant Wallets"
  rows: 220
  columns:
    id: { type: UUID, pk: true, description: "Settlement account identifier" }
    merchant_id: { type: UUID, fk: merchants.id, description: "Parent merchant" }
    bank_name: { type: String, description: "Settlement bank (e.g. BPI, BDO, Metrobank, UnionBank, GCash_Pro_Wallet)" }
    account_number_mask: { type: String, description: "Masked account number (e.g. *******1234)" }
    account_type: { type: String, values: [current, savings, gcash_wallet], description: "Settlement modality" }
    is_primary: { type: Boolean, default: true, description: "Primary payout account flag" }
    status: { type: String, values: [active, unverified, inactive] }

merchant_contacts:
  domain: "Merchants"
  description: "Store personnel contacts (Owner, Cashier, Store Manager, Shift Lead) for DSP visits"
  rows: 350
  columns:
    id: { type: UUID, pk: true, description: "Unique contact identifier" }
    merchant_id: { type: UUID, fk: merchants.id, description: "Parent merchant" }
    contact_name: { type: String, description: "Contact full name" }
    contact_role: { type: String, values: [Owner, Store_Manager, Cashier, Bookkeeper], description: "Role at store" }
    phone_number: { type: String, description: "Direct mobile number" }
    email: { type: String, nullable: true, description: "Direct email" }
    is_primary_decision_maker: { type: Boolean, default: false, description: "Flag if person approves QR upgrades" }

# ------------------------------------------------------------------------------
# DOMAIN 4: OUTLET OPERATIONS & HARDWARE/COLLATERALS (5 TABLES)
# ------------------------------------------------------------------------------
outlets:
  domain: "Outlets & Collaterals"
  description: "Physical store branches visited by DSPs - Central entity in Sales Coach AI"
  rows: 708
  columns:
    id: { type: UUID, pk: true, description: "Unique outlet identifier" }
    merchant_id: { type: UUID, fk: merchants.id, description: "Parent merchant legal entity" }
    area_id: { type: UUID, fk: areas.id, description: "Assigned territory sales cluster" }
    outlet_name: { type: String, description: "Store signage / branch name (e.g. Puregold Makati, 7-Eleven Eastwood)" }
    address: { type: String, description: "Street address and barangay" }
    city: { type: String, description: "City or municipality" }
    region: { type: String, description: "Administrative region" }
    latitude: { type: Float, description: "GPS Latitude for route optimization" }
    longitude: { type: Float, description: "GPS Longitude for route optimization" }
    outlet_type: { type: String, values: [Supermarket, Convenience, Sari-Sari, Pharmacy, Pawnshop, Retail] }
    status: { type: String, values: [active, at_risk, churned, inactive], description: "Operational health status" }
    onboarding_date: { type: Date, description: "Go-live date for GCash acceptance" }

dsp_outlet_assignments:
  domain: "Outlets & Collaterals"
  description: "DSP to Outlet routing and multi-tenancy assignment mapping"
  rows: 708
  columns:
    id: { type: UUID, pk: true, description: "Assignment record identifier" }
    dsp_id: { type: UUID, fk: dsps.id, description: "Assigned field representative" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Assigned retail outlet" }
    assigned_date: { type: Date, description: "Assignment start date" }
    route_frequency: { type: String, values: [daily, twice_weekly, weekly, biweekly], description: "Target visit cadence" }
    status: { type: String, values: [active, reallocated, inactive], default: active }

outlet_operating_hours:
  domain: "Outlets & Collaterals"
  description: "Store operating schedules and peak foot-traffic hours for DSP visit timing"
  rows: 708
  columns:
    id: { type: UUID, pk: true, description: "Schedule identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Store outlet reference" }
    day_of_week: { type: Integer, range: "0-6", description: "0=Sunday, 1=Monday, ..., 6=Saturday" }
    opening_time: { type: String, description: "Opening time (e.g. 07:00:00)" }
    closing_time: { type: String, description: "Closing time (e.g. 22:00:00)" }
    peak_traffic_window: { type: String, description: "High-volume customer rush hours (e.g. 11:30-13:30, 17:00-19:30)" }
    is_24_hours: { type: Boolean, default: false, description: "24-hour convenience store flag" }

pos_terminals:
  domain: "Outlets & Collaterals"
  description: "Hardware payment terminals, handheld POS devices, and optical barcode scanners deployed at outlets"
  rows: 450
  columns:
    id: { type: UUID, pk: true, description: "Terminal hardware identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Deployed outlet location" }
    terminal_sn: { type: String, unique: true, description: "Device serial number (e.g. POS-NCR-90214)" }
    device_model: { type: String, description: "Device model (e.g. Sunmi V2 Pro, Pax A920, Castles MP200)" }
    firmware_version: { type: String, description: "Installed firmware version (e.g. v2.4.12-rc)" }
    battery_health_pct: { type: Integer, range: "0-100", description: "Hardware battery capacity percentage" }
    connectivity_type: { type: String, values: [4G_LTE, WiFi, Dual_SIM], description: "Network connection mode" }
    hardware_status: { type: String, values: [operational, degraded, scanner_fault, offline, in_transit] }
    last_heartbeat: { type: DateTime, description: "Last telemetry ping received from terminal" }

qr_collaterals:
  domain: "Outlets & Collaterals"
  description: "Physical merchandising standees, counter tent cards, window decals, and QR sticker assets"
  rows: 850
  columns:
    id: { type: UUID, pk: true, description: "Collateral asset identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Deployed store location" }
    collateral_type: { type: String, values: [acrylic_standee, tent_card, sticker_counter, window_decal, cashier_wobbler] }
    qr_payload_version: { type: String, description: "EMVCo QR standard version (e.g. QRPh-v2)" }
    qr_code_id: { type: String, description: "Unique dynamic/static QR token printed on asset" }
    condition: { type: String, values: [pristine, good, faded, torn, missing], description: "Merchandising visual quality" }
    placement_location: { type: String, values: [counter_checkout, storefront_glass, entrance_door, drive_thru] }
    deployed_at: { type: Date, description: "Deployment date" }
    last_inspected_at: { type: Date, description: "Last DSP physical audit check date" }

# ------------------------------------------------------------------------------
# DOMAIN 5: PRODUCTS, TRANSACTIONS & LIQUIDITY (5 TABLES)
# ------------------------------------------------------------------------------
products:
  domain: "Products & Payments"
  description: "GCash financial and digital service offerings enabled at partner merchants"
  rows: 10
  columns:
    id: { type: UUID, pk: true, description: "Unique product identifier" }
    product_code: { type: String, unique: true, description: "Code (e.g. QR_PAY, CASH_IN, CASH_OUT, BILLS_PAY, BUY_LOAD, GCREDIT)" }
    product_name: { type: String, description: "Product commercial brand name" }
    category: { type: String, values: [payments, cash, telco, lending, savings, bills, insurance] }
    revenue_yield_pct: { type: Float, description: "GCash revenue cut or MDR basis points" }
    min_recommended_daily_float: { type: Float, description: "Recommended liquidity float reserve in PHP" }

outlet_products:
  domain: "Products & Payments"
  description: "Active service entitlements and enablement status per retail store"
  rows: 3519
  columns:
    id: { type: UUID, pk: true, description: "Product activation record identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Outlet reference" }
    product_id: { type: UUID, fk: products.id, description: "Product reference" }
    status: { type: String, values: [active, pending, inactive], description: "Activation state" }
    commission_rate: { type: Float, description: "Store-specific commission or merchant discount rate" }
    activated_date: { type: Date, description: "First activation date" }

transactions:
  domain: "Products & Payments"
  description: "Detailed financial transaction stream processed through GCash at merchant outlets"
  rows: 22000
  columns:
    id: { type: UUID, pk: true, description: "Unique transaction reference" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Processing outlet" }
    txn_type: { type: String, values: [QR_PAYMENT, CASH_IN, CASH_OUT, BILL_PAY, BUY_LOAD, GCREDIT] }
    amount: { type: Float, range: "50-50000", currency: PHP, description: "Transaction value in PHP" }
    currency: { type: String, default: PHP }
    status: { type: String, values: [SUCCESS, FAILED, REVERSED], distribution: "92/5/3" }
    response_code: { type: String, values: [00_SUCCESS, 51_INSUFFICIENT_FUNDS, 91_TIMEOUT, 96_SYSTEM_ERROR] }
    txn_date: { type: DateTime, description: "Transaction settlement timestamp" }

daily_outlet_metrics:
  domain: "Products & Payments"
  description: "Pre-aggregated end-of-day summary metrics per store for rapid analytics"
  rows: 4500
  columns:
    id: { type: UUID, pk: true, description: "Daily metric summary identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Store outlet" }
    metric_date: { type: Date, description: "Aggregation calendar date" }
    total_gmv: { type: Float, description: "Total Gross Merchandise Volume in PHP" }
    total_transactions: { type: Integer, description: "Count of successful transactions" }
    failed_transactions: { type: Integer, description: "Count of failed / declined transactions" }
    unique_customers: { type: Integer, description: "Count of unique GCash user wallets" }
    avg_ticket_size: { type: Float, description: "Mean transaction ticket in PHP" }
    cash_in_volume: { type: Float, description: "Subtotal Cash-In volume in PHP" }
    qr_payment_volume: { type: Float, description: "Subtotal QR merchant payment volume in PHP" }

cash_in_liquidity_logs:
  domain: "Products & Payments"
  description: "Merchant float balance logs and stockout events for Cash-In / Cash-Out services"
  rows: 1200
  columns:
    id: { type: UUID, pk: true, description: "Float record identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Store outlet" }
    log_date: { type: Date, description: "Record date" }
    opening_float: { type: Float, description: "Starting cash wallet balance in PHP" }
    closing_float: { type: Float, description: "Ending cash wallet balance in PHP" }
    float_stockout_occurred: { type: Boolean, description: "True if merchant had to reject cash-in due to zero float" }
    replenishment_amount: { type: Float, description: "Bank or DSP float reload in PHP" }
    replenishment_source: { type: String, values: [bank_transfer, dsp_direct, sister_branch, none] }

# ------------------------------------------------------------------------------
# DOMAIN 6: AI INTELLIGENCE, SCORING & ML OBSERVABILITY (4 TABLES)
# ------------------------------------------------------------------------------
outlet_scores:
  domain: "AI Intelligence & ML"
  description: "AI-generated daily multi-factor priority scores determining DSP daily route priority"
  rows: 708
  columns:
    id: { type: UUID, pk: true, description: "Score record identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Evaluated outlet" }
    priority_score: { type: Float, range: "10-100", description: "Composite score (>80=Red/Critical, 50-80=Yellow, <50=Green)" }
    transaction_score: { type: Float, range: "0-100", description: "Transaction volume drop signal" }
    engagement_score: { type: Float, range: "0-100", description: "Merchant portal and visit response signal" }
    product_adoption_score: { type: Float, range: "0-100", description: "Service mix breadth score" }
    risk_score: { type: Float, range: "0-100", description: "Churn and competitor substitution risk" }
    contributing_factors: { type: String, description: "Delimited/JSON list of key drivers (e.g. low_transaction_volume|missed_visits)" }
    score_date: { type: Date, description: "Scoring date" }
    model_version: { type: String, description: "ML model inference version" }

scoring_feature_store:
  domain: "AI Intelligence & ML"
  description: "Precomputed analytical feature vectors fed into XGBoost/LightGBM priority scoring models"
  rows: 708
  columns:
    id: { type: UUID, pk: true, description: "Feature record identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Outlet entity" }
    days_since_last_txn: { type: Integer, description: "Dormancy indicator" }
    days_since_last_visit: { type: Integer, description: "DSP coverage recency indicator" }
    gmv_wow_growth_pct: { type: Float, description: "Week-over-week GMV delta percentage" }
    gmv_mom_growth_pct: { type: Float, description: "Month-over-month GMV delta percentage" }
    cash_in_stockout_count_7d: { type: Integer, description: "Frequency of float outages in last 7 days" }
    qr_standee_damage_flag: { type: Boolean, description: "Audit flag indicating broken merchandising" }
    pos_terminal_offline_hours_7d: { type: Float, description: "POS connectivity disruption hours in last 7 days" }
    computed_at: { type: DateTime, description: "Batch feature computation timestamp" }

ml_model_registry:
  domain: "AI Intelligence & ML"
  description: "Trained ML model artifacts, architecture types, weights, hyperparameters, and F1/AUC metrics"
  rows: 8
  columns:
    id: { type: UUID, pk: true, description: "Model registration identifier" }
    model_name: { type: String, description: "Model name (e.g. OutletPriorityXGB, ChurnHazardCox, CollateralDamageCNN)" }
    model_version: { type: String, unique: true, description: "Semantic version code (e.g. v1.0.0, v1.1.2-prod)" }
    algorithm: { type: String, values: [XGBoost, LightGBM, Random_Forest, Neural_Network, Logistic_Regression] }
    auc_roc: { type: Float, range: "0.5-1.0", description: "Validation AUC-ROC metric" }
    f1_score: { type: Float, range: "0-1.0", description: "Validation F1 score" }
    hyperparameters: { type: String, description: "JSON string of learning rate, max depth, estimators" }
    deployment_status: { type: String, values: [champion, challenger, retired, shadow] }
    deployed_at: { type: DateTime, description: "Production rollout date" }

model_drift_metrics:
  domain: "AI Intelligence & ML"
  description: "MLOps data and concept drift telemetry tracking PSI and Kolmogorov-Smirnov statistical shifts"
  rows: 45
  columns:
    id: { type: UUID, pk: true, description: "Drift observation identifier" }
    model_id: { type: UUID, fk: ml_model_registry.id, description: "Evaluated model artifact" }
    feature_name: { type: String, description: "Monitored feature (e.g. gmv_wow_growth_pct, days_since_last_visit)" }
    metric_type: { type: String, values: [PSI, KS_TEST, WASSERSTEIN_DISTANCE], description: "Statistical drift test" }
    metric_value: { type: Float, description: "Computed test statistic (e.g. PSI=0.18)" }
    threshold: { type: Float, default: 0.2, description: "Alert trigger threshold" }
    drift_detected: { type: Boolean, description: "True if metric exceeds threshold indicating dataset shift" }
    evaluated_at: { type: DateTime, description: "Evaluation timestamp" }

# ------------------------------------------------------------------------------
# DOMAIN 7: ACTION ENGINE, STRATEGY & RECOMMENDATIONS (4 TABLES)
# ------------------------------------------------------------------------------
action_catalog:
  domain: "Action Engine"
  description: "Master catalog of prescriptive sales intervention types and playbook templates"
  rows: 15
  columns:
    id: { type: UUID, pk: true, description: "Action type identifier" }
    action_code: { type: String, unique: true, description: "Code (e.g. MERCH_AUDIT, CASHIN_FLOAT, POS_SWAP, GCREDIT_UPSELL)" }
    action_name: { type: String, description: "Human-readable action name" }
    category: { type: String, values: [merchandising, liquidity, hardware, education, cross_sell] }
    recommended_duration_minutes: { type: Integer, description: "Estimated time to perform action on-site" }
    business_impact: { type: String, values: [high, medium, critical], description: "Strategic revenue impact" }

action_recommendations:
  domain: "Action Engine"
  description: "Prescriptive, outlet-specific action cards generated by AI for DSP field reps"
  rows: 500
  columns:
    id: { type: UUID, pk: true, description: "Recommendation identifier" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Target store" }
    dsp_id: { type: UUID, fk: dsps.id, description: "Assigned field representative" }
    action_type: { type: String, description: "Intervention category (e.g. Merchandising Audit, Cash-In Training)" }
    action_detail: { type: String, description: "Specific guidance script and steps for the DSP" }
    priority: { type: String, values: [CRITICAL, HIGH, MEDIUM, LOW] }
    status: { type: String, values: [pending, in_progress, completed, rejected], distribution: "40/20/30/10" }
    action_catalog_id: { type: UUID, fk: action_catalog.id, nullable: true, description: "Master action link" }
    due_date: { type: Date, description: "Recommended execution deadline" }
    created_at: { type: DateTime, description: "Generation timestamp" }

pitch_playbooks:
  domain: "Action Engine"
  description: "Objection handling scripts, talking points, and value propositions customized by merchant type"
  rows: 20
  columns:
    id: { type: UUID, pk: true, description: "Playbook script identifier" }
    category_id: { type: UUID, fk: merchant_categories.id, nullable: true, description: "Target retail category" }
    product_id: { type: UUID, fk: products.id, nullable: true, description: "Target product" }
    merchant_objection: { type: String, description: "Common merchant pushback (e.g. fees too high, customer no GCash, cash is king)" }
    recommended_pitch: { type: String, description: "Field-tested rebuttal script and value proposition" }
    incentive_offer: { type: String, nullable: true, description: "Authorized promo or waiver (e.g. 0% QR fees for 30 days)" }
    effectiveness_rating: { type: Float, range: "1.0-5.0", description: "DSP average rating of script success" }

action_feedback_logs:
  domain: "Action Engine"
  description: "Frontline DSP feedback on AI action recommendation quality and ground-truth acceptance"
  rows: 350
  columns:
    id: { type: UUID, pk: true, description: "Feedback record identifier" }
    recommendation_id: { type: UUID, fk: action_recommendations.id, description: "Target recommendation" }
    dsp_id: { type: UUID, fk: dsps.id, description: "Submitting representative" }
    is_accepted: { type: Boolean, description: "True if DSP accepted and executed recommendation" }
    rejection_reason: { type: String, nullable: true, values: [store_closed, merchant_hostile, already_resolved, inaccurate_data, no_time] }
    feedback_notes: { type: String, nullable: true, description: "Freeform commentary from DSP" }
    submitted_at: { type: DateTime, description: "Submission timestamp" }

# ------------------------------------------------------------------------------
# DOMAIN 8: FIELD EXECUTION, AUDITS & VISIT EVIDENCE (3 TABLES)
# ------------------------------------------------------------------------------
visit_logs:
  domain: "Field Execution & Evidence"
  description: "Frontline DSP store check-in visits with GPS verification, duration, and outcomes"
  rows: 1200
  columns:
    id: { type: UUID, pk: true, description: "Visit record identifier" }
    dsp_id: { type: UUID, fk: dsps.id, description: "Visiting field rep" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Visited store" }
    visit_date: { type: DateTime, description: "Visit timestamp" }
    visit_type: { type: String, values: [SCHEDULED, AD_HOC, ESCALATION, REVISIT] }
    outcome: { type: String, values: [COMPLETED, MERCHANT_ABSENT, STORE_CLOSED, RESCHEDULED, REFUSED_ENTRY] }
    notes: { type: String, nullable: true, description: "Store observations notes" }
    duration_minutes: { type: Integer, description: "Time spent at merchant store" }
    check_in_lat: { type: Float, nullable: true, description: "GPS verification latitude" }
    check_in_lng: { type: Float, nullable: true, description: "GPS verification longitude" }

merchandising_audit_items:
  domain: "Field Execution & Evidence"
  description: "Checklist audit items evaluated by DSPs during store visits (standee visibility, sticker wear)"
  rows: 2400
  columns:
    id: { type: UUID, pk: true, description: "Audit checklist item identifier" }
    visit_id: { type: UUID, fk: visit_logs.id, description: "Associated field visit" }
    collateral_id: { type: UUID, fk: qr_collaterals.id, nullable: true, description: "Inspected physical asset" }
    audit_category: { type: String, values: [qr_visibility, sticker_cleanliness, terminal_cleanliness, competitor_signage] }
    is_compliant: { type: Boolean, description: "Pass/fail compliance standard" }
    deficiency_reason: { type: String, nullable: true, values: [obscured_by_goods, torn_or_faded, wrong_qr_code, competitor_qr_covering] }
    action_taken: { type: String, nullable: true, values: [cleaned, replaced_on_spot, requested_replacement, repositioned] }

outlet_photos:
  domain: "Field Execution & Evidence"
  description: "Photographic proof of merchandising audits, counter setups, and damaged QR collaterals"
  rows: 1500
  columns:
    id: { type: UUID, pk: true, description: "Photo record identifier" }
    visit_id: { type: UUID, fk: visit_logs.id, description: "Associated field visit" }
    outlet_id: { type: UUID, fk: outlets.id, description: "Store outlet" }
    photo_type: { type: String, values: [storefront_exterior, checkout_counter, qr_standee_closeup, damaged_collateral, competitor_placement] }
    photo_url: { type: String, description: "S3 object storage URI or mock CDN link" }
    ai_validation_label: { type: String, description: "Computer vision classification label (e.g. Valid_GCash_Standee, Damaged_QR, Missing_Collateral)" }
    ai_confidence_score: { type: Float, range: "0-1.0", description: "CV model detection confidence" }
    captured_at: { type: DateTime, description: "Camera capture timestamp" }
